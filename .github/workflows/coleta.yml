# Coletores agendados. Exige o secret DATABASE_URL (e, opcionalmente, COLETOR_EMAIL_CONTATO e SITE_URL).
# Horários em UTC: Brasília = UTC−3.
name: Coleta
on:
  schedule:
    # Agenda e votações: a cada 15 min das 8h às 23h de Brasília, de segunda a sexta (11h–02h UTC)
    - cron: "*/15 11-23 * * 1-5"
    - cron: "*/15 0-2 * * 2-6"
    # Fora desse horário: 1×/hora
    - cron: "7 3-10 * * *"
    - cron: "7 11-23 * * 0,6"
    # Rotina diária (cadastros, despesas, presença, autoria, tramitação): 6h10 de Brasília
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      rotina:
        description: "Rotina ou tarefa, com argumentos opcionais (ex.: frequente, diaria, inicial, camara:autoria 2023-02-01)"
        required: true
        default: frequente

concurrency:
  # Filas separadas: uma execução manual não é descartada pela agendada seguinte
  group: coleta-${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event.schedule == '10 9 * * *' && 'diaria' || 'frequente') }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLETOR_EMAIL_CONTATO: ${{ secrets.COLETOR_EMAIL_CONTATO }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      DADOS_BRUTOS_DIR: ./dados-brutos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - name: Coletar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then R="${{ inputs.rotina }}";
          elif [ "${{ github.event.schedule }}" = "10 9 * * *" ]; then R=diaria; else R=frequente; fi
          # Sem aspas de propósito: permite "tarefa arg1 arg2" (entrada só de quem administra o repositório)
          npm run coletar -- $R
      # Respostas brutas desta execução ficam guardadas por 30 dias para auditoria
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brutos-${{ github.run_id }}
          path: dados-brutos/
          retention-days: 30
          if-no-files-found: ignore
